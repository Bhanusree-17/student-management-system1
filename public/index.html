
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- ================= LOGIN / SIGNUP ================= -->

    <div id="auth" class="auth">

        <form id="authForm" class="auth-card">

            <div class="brand">SMS</div>

            <h1 id="authTitle">Welcome back</h1>

            <p>Student management dashboard</p>

            <!-- Signup name -->
            <label id="nameWrap" hidden>
                Full name

                <input
                    name="fullName"
                    type="text"
                    autocomplete="name"
                    placeholder="Enter your full name">
            </label>

            <!-- Email -->
            <label>
                Email

                <input
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required>
            </label>

            <!-- Password -->
            <label>
                Password

                <input
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    minlength="6"
                    placeholder="Enter your password"
                    required>
            </label>

            <!-- Submit -->
            <button
                id="authSubmit"
                type="submit">
                Sign in
            </button>

            <!-- Error -->
            <div
                id="authError"
                class="error">
            </div>

            <!-- Signup / Login switch -->
            <button
                type="button"
                class="link"
                id="toggleAuth">

                Create an account

            </button>

        </form>

    </div>


    <!-- ================= DASHBOARD ================= -->

    <div id="app" hidden>

        <!-- SIDEBAR -->

        <aside id="sidebar">

            <div class="brand">
                SMS <span>Campus</span>
            </div>

            <!-- Dashboard -->
            <button
                class="nav active"
                data-view="dashboard">

                ▦ Dashboard

            </button>

            <!-- Students -->
            <button
                class="nav"
                data-view="students">

                ♙ Students

            </button>

            <!-- Marks -->
            <button
                class="nav"
                data-view="marks">

                ▤ Marks & performance

            </button>

            <!-- Attendance -->
            <button
                class="nav"
                data-view="attendance">

                ◷ Attendance

            </button>

            <!-- Sidebar bottom -->

            <div class="side-bottom">

                <div id="userName">
                    Account
                </div>

                <button
                    id="logout"
                    class="nav"
                    type="button">

                    ↪ Logout

                </button>

            </div>

        </aside>


        <!-- MAIN DASHBOARD -->

        <main>

            <!-- HEADER -->

            <header>

                <button
                    id="menu"
                    type="button"
                    aria-label="Open menu">

                    ☰

                </button>

                <div>

                    <small>
                        STUDENT MANAGEMENT
                    </small>

                    <h1 id="pageTitle">
                        Dashboard
                    </h1>

                </div>

                <button
                    id="quickAdd"
                    class="primary"
                    type="button">

                    + Add student

                </button>

            </header>


            <!-- DASHBOARD STATISTICS -->

            <section
                id="stats"
                class="stats">

            </section>


            <!-- PAGE CONTENT -->

            <section
                id="content">

            </section>

        </main>

    </div>


    <!-- NOTIFICATION -->

    <div id="toast"></div>


    <!-- JAVASCRIPT -->

    <script src="app.js"></script>

</body>

</html>
